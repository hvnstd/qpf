[supervisord]
user=root
; Maritime reads the container's stdout/stderr as agent logs, so send the
; interesting services there. logfile_maxbytes=0 disables rotation, which
; would fail on /dev/stdout.
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/log/supervisord.pid
nodaemon=true

[program:dbus]
command=/bin/sh -c "rm -f /run/dbus/pid; mkdir -p /run/dbus; exec /usr/bin/dbus-daemon --system --nofork"
autostart=true
autorestart=true
priority=5
stderr_logfile=/var/log/dbus.err.log
stdout_logfile=/var/log/dbus.out.log

[program:xvfb]
command=/bin/sh -c "rm -f /tmp/.X1-lock /tmp/.X11-unix/X1; mkdir -p /tmp/.X11-unix; exec /usr/bin/Xvfb :1 -screen 0 1280x800x24"
autostart=true
autorestart=true
priority=10
environment=DISPLAY=":1"
stderr_logfile=/var/log/xvfb.err.log
stdout_logfile=/var/log/xvfb.out.log

[program:xfce4]
command=/bin/sh -c 'export DISPLAY=:1; for i in $(seq 1 200); do [ -S /tmp/.X11-unix/X1 ] && break; sleep 0.1; done; exec dbus-run-session startxfce4'
autostart=true
autorestart=true
priority=20
environment=DISPLAY=":1"
stderr_logfile=/var/log/xfce4.err.log
stdout_logfile=/var/log/xfce4.out.log

[program:app]
; Loopback only: the Maritime adapter is the single public entrypoint and
; forwards to this API. No auth is needed on the app itself.
command=qwenpaw app --host 127.0.0.1 --port 8088
autostart=true
autorestart=unexpected
startretries=5
startsecs=10
priority=30
stopwaitsecs=30
environment=DISPLAY=":1",PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="/usr/bin/chromium",QWENPAW_RUNNING_IN_CONTAINER="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:adapter]
; Reads $PORT from the environment inherited from the container.
command=/app/venv/bin/python /app/maritime/adapter.py
autostart=true
autorestart=true
startretries=10
startsecs=3
priority=40
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
